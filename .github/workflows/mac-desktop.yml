name: Build Mac desktop

on:
  push:
    branches:
      - 'build/mac-desktop-*'
  workflow_dispatch:
    inputs:
      signed:
        description: Developer ID signed and Apple notarized release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Mac ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    environment: ${{ inputs.signed && 'mac-signing' || 'mac-test' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            server/package-lock.json
      - name: Prepare CI dependency downloads
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          for (const file of ['server/package-lock.json', 'app/package-lock.json']) {
            const lock = JSON.parse(fs.readFileSync(file, 'utf8'));
            let changed = 0;
            for (const pkg of Object.values(lock.packages || {})) {
              if (pkg.resolved?.startsWith('https://registry.npmmirror.com/')) {
                pkg.resolved = pkg.resolved.replace('https://registry.npmmirror.com/', 'https://registry.npmjs.org/');
                changed++;
              }
            }
            fs.writeFileSync(file, JSON.stringify(lock, null, 2) + '\n');
            console.log(`${file}: using official registry for ${changed} locked packages`);
          }
          NODE
      - name: Install server dependencies
        timeout-minutes: 10
        env:
          npm_config_registry: https://registry.npmjs.org
          npm_config_fetch_timeout: '30000'
          npm_config_fetch_retries: '2'
        run: npm ci --prefix server --no-audit --no-fund --foreground-scripts --loglevel info
      - name: Install app dependencies
        timeout-minutes: 10
        env:
          npm_config_registry: https://registry.npmjs.org
          npm_config_fetch_timeout: '30000'
          npm_config_fetch_retries: '2'
        run: npm ci --prefix app --no-audit --no-fund --foreground-scripts --loglevel info
      - name: Verify desktop account networking
        run: npm run test:account --prefix app
      - name: Verify Mac automatic update and rollback
        working-directory: app
        run: |
          node --test electron/test-mac-update.cjs electron/test-update-download.cjs electron/test-update-release.cjs electron/test-mac-platform.cjs electron/test-mac-stapler.cjs
          node electron/test-mac-update-native.cjs
      - name: Prepare bundled Python and MinerU weights
        env:
          UV_CACHE_DIR: ${{ github.workspace }}/tmp/parser-build-cache
          UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/tmp/uv-python
        run: |
          brew install uv
          uv run --no-project --managed-python --python 3.13 server/scripts/prepare-parser-runtime.py --download-models
      - name: Diagnose prepared parser startup
        working-directory: app
        timeout-minutes: 5
        run: |
          npm run build:server
          npm run prepare:desktop
          node <<'NODE'
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const { spawnSync } = require('node:child_process');
          const { pathToFileURL } = require('node:url');
          const temporary = fs.mkdtempSync(path.resolve('../tmp/parser-ci-diagnostic-'));
          const parser = path.resolve('.desktop/parser');
          const runtime = path.resolve('.desktop/server');
          const script = `
            const os = await import('node:os');
            const { createResourceSampler, resourceBudget, singleWorkerBudget } = await import(${JSON.stringify(pathToFileURL(path.join(parser, 'python/desktop-resources.mjs')).href)});
            const { HttpWorkerPool } = await import(${JSON.stringify(pathToFileURL(path.join(parser, 'python/http-worker-pool.mjs')).href)});
            const { PythonWorkerPool } = await import(${JSON.stringify(pathToFileURL(path.join(parser, 'python/python-workers.ts')).href)});
            let observedPool;
            const originalRun = HttpWorkerPool.prototype.run;
            HttpWorkerPool.prototype.run = function (...args) {
              observedPool = this;
              return originalRun.apply(this, args);
            };
            const sample = createResourceSampler();
            const snapshot = stage => {
              const resources = sample();
              const budget = resourceBudget(resources);
              const slots = observedPool?.slots.map(slot => ({
                active: Boolean(slot.active), profile: slot.profile,
                hasWorker: slot.pool?.hasWorker,
                workers: slot.pool ? [...slot.pool.workers].map(worker => ({
                  pid: worker.child.pid, ready: worker.ready, dead: worker.dead,
                  memoryMB: worker.memoryMB, action: worker.job?.input.action
                })) : []
              }));
              process.stderr.write(JSON.stringify({
                event: 'parser-ci-diagnostic', stage, resources, budget,
                fallbackBudget: singleWorkerBudget(budget),
                queue: observedPool?.queue.length, slots
              }) + '\\n');
            };
            const deadline = setTimeout(() => { snapshot('diagnostic-deadline'); process.exit(2); }, 120000);
            const timer = setInterval(() => snapshot('progress'), 15000);
            snapshot('before-parse');
            try {
              const { parseDocument, closeDocumentParser } = await import(${JSON.stringify(pathToFileURL(path.join(runtime, 'dist/infrastructure/document-jobs.js')).href)});
              globalThis.fetch = () => { throw new Error('Unexpected network call during document parsing'); };
              const parsed = await parseDocument(${JSON.stringify(path.resolve('../server/eval/v2/assets/native-contract.pdf'))}, 'native-contract.pdf');
              snapshot('parsed');
              if (!parsed.pages || !parsed.text.trim()) throw new Error('Prepared PDF parsing failed');
              await closeDocumentParser();
            } finally {
              clearInterval(timer);
              clearTimeout(deadline);
            }
          `;
          try {
            const result = spawnSync(require('electron'), ['--input-type=module', '--eval', script], {
              encoding: 'utf8', timeout: 150000,
              env: { ...process.env, ELECTRON_RUN_AS_NODE: '1', NODE_ENV: 'test',
                APP_RUNTIME_ROOT: runtime, APP_DATA_ROOT: temporary,
                PARSER_BUNDLE_ROOT: parser, WORKSPACE_DATA_DIR: temporary,
                STORAGE_LOCAL_ROOT: path.join(temporary, 'storage'),
                AUTO_RUN_MIGRATIONS: 'false', KNOWLEDGE_RAG_MODE: 'local', AI_GATEWAY_MODE: 'cloud' }
            });
            process.stdout.write(result.stdout || '');
            process.stderr.write(result.stderr || '');
            if (result.error) throw result.error;
            process.exitCode = result.status ?? 1;
          } finally {
            fs.rmSync(temporary, { recursive: true, force: true });
          }
          NODE
      - name: Build unsigned test package
        if: ${{ !inputs.signed }}
        working-directory: app
        run: npm run build:mac -- --arch ${{ matrix.arch }}
      - name: Build signed and notarized package
        if: ${{ inputs.signed }}
        working-directory: app
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ulimit -n 8192
          npm run build:mac:signed -- --arch ${{ matrix.arch }}
      - name: Upload verified packages
        uses: actions/upload-artifact@v4
        with:
          name: LawVerify-Mac-${{ matrix.arch }}-${{ inputs.signed && 'signed' || 'unsigned' }}
          if-no-files-found: error
          retention-days: 30
          path: |
            app/release-mac*/*.dmg
            app/release-mac*/*.zip
            app/release-mac*/*.sha256
            app/release-mac*/verification-*.json
