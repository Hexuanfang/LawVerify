name: Build Mac desktop

on:
  push:
    branches:
      - 'build/mac-desktop-*'
  workflow_dispatch:
    inputs:
      signed:
        description: Developer ID signed and Apple notarized release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Mac ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    environment: ${{ inputs.signed && 'mac-signing' || 'mac-test' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            server/package-lock.json
      - name: Prepare CI dependency downloads
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          for (const file of ['server/package-lock.json', 'app/package-lock.json']) {
            const lock = JSON.parse(fs.readFileSync(file, 'utf8'));
            let changed = 0;
            for (const pkg of Object.values(lock.packages || {})) {
              if (pkg.resolved?.startsWith('https://registry.npmmirror.com/')) {
                pkg.resolved = pkg.resolved.replace('https://registry.npmmirror.com/', 'https://registry.npmjs.org/');
                changed++;
              }
            }
            fs.writeFileSync(file, JSON.stringify(lock, null, 2) + '\n');
            console.log(`${file}: using official registry for ${changed} locked packages`);
          }
          NODE
      - name: Install server dependencies
        timeout-minutes: 10
        env:
          npm_config_registry: https://registry.npmjs.org
          npm_config_fetch_timeout: '30000'
          npm_config_fetch_retries: '2'
        run: npm ci --prefix server --no-audit --no-fund --foreground-scripts --loglevel info
      - name: Install app dependencies
        timeout-minutes: 10
        env:
          npm_config_registry: https://registry.npmjs.org
          npm_config_fetch_timeout: '30000'
          npm_config_fetch_retries: '2'
        run: npm ci --prefix app --no-audit --no-fund --foreground-scripts --loglevel info
      - name: Verify desktop account networking
        run: npm run test:account --prefix app
      - name: Verify Mac automatic update and rollback
        working-directory: app
        run: |
          node --test electron/test-mac-update.cjs electron/test-update-download.cjs electron/test-update-release.cjs electron/test-mac-platform.cjs electron/test-mac-stapler.cjs
          node electron/test-mac-update-native.cjs
      - name: Build unsigned test package
        if: ${{ !inputs.signed }}
        working-directory: app
        run: npm run build:mac -- --arch ${{ matrix.arch }}
      - name: Build signed and notarized package
        if: ${{ inputs.signed }}
        working-directory: app
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run build:mac:signed -- --arch ${{ matrix.arch }}
      - name: Upload verified packages
        uses: actions/upload-artifact@v4
        with:
          name: LawVerify-Mac-${{ matrix.arch }}-${{ inputs.signed && 'signed' || 'unsigned' }}
          if-no-files-found: error
          retention-days: 30
          path: |
            app/release-mac*/*.dmg
            app/release-mac*/*.zip
            app/release-mac*/*.sha256
            app/release-mac*/verification-*.json
