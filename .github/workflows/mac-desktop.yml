name: Build Mac desktop

on:
  push:
    branches:
      - 'build/mac-desktop-*'
  workflow_dispatch:
    inputs:
      signed:
        description: Developer ID signed and Apple notarized release
        type: boolean
        default: false
      signed_only:
        description: Developer ID signed test package without notarization or validation
        type: boolean
        default: false
      resume_run_id:
        description: Resume signed notarization from a previous run recovery artifact (same commit)
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Mac ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    environment: ${{ (inputs.signed || inputs.signed_only) && 'mac-signing' || 'mac-test' }}
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            server/package-lock.json
      - name: Validate recovery options
        env:
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          SIGNED: ${{ inputs.signed }}
          SIGNED_ONLY: ${{ inputs.signed_only }}
        run: |
          if [[ -n "$RESUME_RUN_ID" ]]; then
            [[ "$RESUME_RUN_ID" =~ ^[0-9]+$ && "$SIGNED" == "true" && "$SIGNED_ONLY" != "true" ]] || {
              echo "::error::Recovery requires signed=true, signed_only=false and a numeric run ID."
              exit 1
            }
          fi
      - name: Download original signed build recovery
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: LawVerify-Mac-${{ matrix.arch }}-notary-recovery
          path: ${{ runner.temp }}/notary-recovery
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}
      - name: Restore original signed files and submission IDs
        if: ${{ inputs.resume_run_id != '' }}
        run: tar -xf "${{ runner.temp }}/notary-recovery/notary-recovery-${{ matrix.arch }}.tar" -C app
      - name: Prepare CI dependency downloads
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          for (const file of ['server/package-lock.json', 'app/package-lock.json']) {
            const lock = JSON.parse(fs.readFileSync(file, 'utf8'));
            let changed = 0;
            for (const pkg of Object.values(lock.packages || {})) {
              if (pkg.resolved?.startsWith('https://registry.npmmirror.com/')) {
                pkg.resolved = pkg.resolved.replace('https://registry.npmmirror.com/', 'https://registry.npmjs.org/');
                changed++;
              }
            }
            fs.writeFileSync(file, JSON.stringify(lock, null, 2) + '\n');
            console.log(`${file}: using official registry for ${changed} locked packages`);
          }
          NODE
      - name: Install server dependencies
        timeout-minutes: 10
        env:
          npm_config_registry: https://registry.npmjs.org
          npm_config_fetch_timeout: '30000'
          npm_config_fetch_retries: '2'
        run: npm ci --prefix server --no-audit --no-fund --foreground-scripts --loglevel info
      - name: Install app dependencies
        timeout-minutes: 10
        env:
          npm_config_registry: https://registry.npmjs.org
          npm_config_fetch_timeout: '30000'
          npm_config_fetch_retries: '2'
        run: npm ci --prefix app --no-audit --no-fund --foreground-scripts --loglevel info
      - name: Verify desktop account networking
        if: ${{ !inputs.signed_only }}
        run: npm run test:account --prefix app
      - name: Verify Mac automatic update and rollback
        if: ${{ !inputs.signed_only }}
        working-directory: app
        run: |
          node --test electron/test-mac-update.cjs electron/test-update-download.cjs electron/test-update-release.cjs electron/test-mac-platform.cjs electron/test-mac-stapler.cjs electron/test-mac-notary.cjs electron/test-mac-signed-only.cjs
          node electron/test-mac-update-native.cjs
      - name: Build unsigned test package
        if: ${{ !inputs.signed && !inputs.signed_only }}
        working-directory: app
        run: npm run build:mac -- --arch ${{ matrix.arch }}
      - name: Build signed and notarized package
        if: ${{ inputs.signed && !inputs.signed_only }}
        timeout-minutes: 300
        working-directory: app
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          args=(--arch "${{ matrix.arch }}")
          if [[ -n "$RESUME_RUN_ID" ]]; then args+=(--resume); fi
          npm run build:mac:signed -- "${args[@]}"
      - name: Build signed-only test package without validation
        if: ${{ inputs.signed_only }}
        timeout-minutes: 20
        working-directory: app
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: npm run build:mac -- --signed-only --arch ${{ matrix.arch }}
      - name: Preserve signed files and Apple submission state
        if: ${{ always() && inputs.signed && !inputs.signed_only }}
        run: |
          if [[ -d app/release-mac ]]; then
            tar -cf "${{ runner.temp }}/notary-recovery-${{ matrix.arch }}.tar" -C app release-mac
          fi
      - name: Upload notarization recovery (not a public release)
        if: ${{ always() && inputs.signed && !inputs.signed_only }}
        uses: actions/upload-artifact@v4
        with:
          name: LawVerify-Mac-${{ matrix.arch }}-notary-recovery
          if-no-files-found: warn
          retention-days: 30
          path: ${{ runner.temp }}/notary-recovery-${{ matrix.arch }}.tar
      - name: Upload packages and integrity reports
        uses: actions/upload-artifact@v4
        with:
          name: LawVerify-Mac-${{ matrix.arch }}-${{ inputs.signed_only && 'signed-only' || inputs.signed && 'signed' || 'unsigned' }}
          if-no-files-found: error
          retention-days: 30
          path: |
            app/release-mac*/LawVerify-Mac-*.dmg
            app/release-mac*/LawVerify-Mac-*.zip
            app/release-mac*/LawVerify-Mac-*.sha256
            app/release-mac*/verification-*.json
            app/release-mac*/build-report-*.json
