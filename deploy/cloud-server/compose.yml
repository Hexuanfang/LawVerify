name: lawverify

services:
  postgres:
    container_name: lawverify-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lawverify_cloud
      POSTGRES_USER: lawverify
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lawverify -d lawverify_cloud"]
      interval: 10s
      timeout: 5s
      retries: 10

  cloud-server:
    container_name: lawverify-cloud-server
    image: lawverify-cloud-server:${CLOUD_SERVER_IMAGE_TAG:-${IMAGE_TAG:-latest}}
    pull_policy: never
    restart: unless-stopped
    env_file: ${CLOUD_SERVER_ENV_FILE:-cloud-server/.env}
    environment:
      CLOUD_HOST: 0.0.0.0
      CLOUD_PORT: 8788
      DATABASE_URL: postgres://lawverify:${POSTGRES_PASSWORD}@postgres:5432/lawverify_cloud
      AUTO_RUN_MIGRATIONS: "true"
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
    ports:
      - "127.0.0.1:8788:8788"
    volumes:
      - ${RELEASE_DIR:-./releases}:/opt/lawverify/app/release:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
