name: lawverify-build

services:
  parser:
    image: ${DEPLOY_BUILD_IMAGE:?请通过 deploy.sh 构建镜像}
    platform: ${DEPLOY_PLATFORM:?请通过 deploy.sh 选择构建架构}
    build:
      context: ../python-workers
      args:
        NODE_IMAGE: ${DOCKER_REGISTRY_PREFIX:-}node:22-bookworm-slim
        PYTHON_IMAGE: ${DOCKER_REGISTRY_PREFIX:-}python:3.13-slim-bookworm
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://deb.debian.org}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
